[project]
name = "featurelens"
version = "0.16.0"
description = "Causal sparse-feature interpretability workbench for Qwen3 and Qwen-Scope SAEs"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
